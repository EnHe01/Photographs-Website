baseURL: "https://enhephotographs.netlify.app/"
title: "EnHe"
enableRobotsTXT: true

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: true

# Expose static/uploads to Hugo's image processing (resources.Get) so
# partials/img.html can generate resized WebP versions. The files are still
# published as-is under /uploads/ by the static mount.
module:
  mounts:
    - source: static
      target: static
    - source: static/uploads
      target: assets/uploads

languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    contentDir: content/zh
    params:
      hero_desc: "用镜头记录那些短暂停留的时刻"
      nav_journal: "日记"
      nav_gallery: "Gallery"
      nav_collab: "Collab"
      all_posts: "所有文章"
      read_more: "Read More"
      drag: "拖动浏览"
      collab_desc: "旅拍、人像、内容合作。在日本各地均可拍摄，欢迎来找我聊。"
      book: "Book a Shoot"
      footer_copy: "Tokyo · Beijing"


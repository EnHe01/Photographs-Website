name: Translate Posts

# Auto-run on push was disabled: it force-overwrites content/en and
# content/ja from content/zh on every push, which would clobber the
# manually reviewed translations produced by the admin's "translate
# suggestion" button. Run manually (workflow_dispatch) if you still want
# a bulk re-translate pass.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install deepl PyYAML

      - name: Translate new/updated posts
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 scripts/translate.py

      - name: Commit translations
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/
          git diff --staged --quiet || git commit -m "auto-translate posts"
          git push

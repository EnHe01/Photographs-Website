[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.162.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://cloud.umami.is; frame-src 'none';"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The admin app's filenames don't change per deploy (no content hash), so
# the long/immutable caching above would make browsers keep running a
# stale admin.js/admin.css indefinitely after every update. Override with
# a short, must-revalidate cache just for /admin/* so fixes actually reach
# people instead of getting stuck behind a 1-year cache.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = false
  conditions = {Language = ["zh", "zh-CN", "zh-TW"]}

[[redirects]]
  from = "/"
  to = "/ja/"
  status = 302
  force = false
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false

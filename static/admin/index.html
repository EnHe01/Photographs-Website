<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>後台登入 · EnHe</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>EnHe 後台</h1>
    <label>帳號<input type="text" id="loginUsername" autocomplete="username" required></label>
    <label>密碼<input type="password" id="loginPassword" autocomplete="current-password" required></label>
    <button type="submit">登入</button>
    <p id="loginError" class="error-text" hidden></p>
  </form>
</div>

<script src="/admin/login.js"></script>
</body>
</html>
